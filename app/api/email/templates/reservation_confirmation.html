<!DOCTYPE html>
<html style="background-color:#0b0b11;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
  </head>
  <body bgcolor="#0b0b11" style="margin:0;padding:0;background-color:#0b0b11;">
    <table role="presentation" width="100%" bgcolor="#0b0b11" cellpadding="0" cellspacing="0" style="background-color:#0b0b11;min-width:100%;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width:520px;width:100%;">

            <!-- Marquee header -->
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="font-family:Georgia, 'Times New Roman', serif;letter-spacing:6px;text-transform:uppercase;font-size:26px;color:#f4f1ea;text-shadow:0 0 18px rgba(217,38,55,0.6);">
                  {{theater_name}}
                </div>
                <div style="font-family:Arial, Helvetica, sans-serif;letter-spacing:4px;text-transform:uppercase;font-size:10px;color:#8a8794;padding-top:8px;">
                  Your seat is waiting
                </div>
              </td>
            </tr>

            <!-- Ticket card -->
            <tr>
              <td style="background-color:#15151f;border:1px solid rgba(255,255,255,0.12);border-radius:16px;overflow:hidden;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:28px;">
                      <div style="font-family:Arial, Helvetica, sans-serif;letter-spacing:3px;text-transform:uppercase;font-size:11px;color:#d92637;font-weight:bold;padding-bottom:12px;">
                        Reservation Confirmed
                      </div>
                      <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                          <td width="120" valign="top">
                            <img src="{{poster_path}}" width="110" alt="{{movie_title}}" style="display:block;border-radius:10px;border:1px solid rgba(255,255,255,0.15);" />
                          </td>
                          <td valign="top" style="padding-left:20px;">
                            <div style="font-family:Georgia, 'Times New Roman', serif;font-size:28px;line-height:1.1;color:#f4f1ea;text-transform:uppercase;letter-spacing:1px;">
                              {{movie_title}}
                            </div>
                            <div style="font-family:Arial, Helvetica, sans-serif;font-size:13px;color:#bdbac6;padding-top:12px;">
                              {{showing_date}}
                            </div>
                            <div style="font-family:Arial, Helvetica, sans-serif;font-size:13px;color:#bdbac6;padding-top:4px;">
                              {{showing_time}}
                            </div>
                            <div style="font-family:Arial, Helvetica, sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:10px;color:#8a8794;padding-top:16px;">
                              Seats
                            </div>
                            <div style="font-family:Georgia, 'Times New Roman', serif;font-size:20px;color:#f0cb5c;padding-top:4px;">
                              {{seats}}
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <!-- Perforation -->
                  <tr>
                    <td style="padding:0 28px;">
                      <div style="border-top:2px dashed rgba(255,255,255,0.18);"></div>
                    </td>
                  </tr>

                  <!-- QR -->
                  <tr>
                    <td align="center" style="padding:28px;">
                      <img src="{{qr_url}}" width="190" height="190" alt="Ticket QR code" style="display:block;border-radius:12px;" />
                      <div style="font-family:Arial, Helvetica, sans-serif;letter-spacing:3px;text-transform:uppercase;font-size:10px;color:#8a8794;padding-top:14px;">
                        Present at the door
                      </div>
                      <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:20px;">
                        <tr>
                          <td style="background-color:#d92637;border-radius:24px;">
                            <a href="{{ticket_url}}" style="display:inline-block;padding:12px 32px;font-family:Arial, Helvetica, sans-serif;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#ffffff;text-decoration:none;">
                              View Your Ticket
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding-top:24px;">
                <div style="font-family:Arial, Helvetica, sans-serif;font-size:11px;color:#5d5a68;">
                  We'll see you at the movies.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
